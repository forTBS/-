<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ระบบจองห้องประชุม TBS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: navy header + tab nav (echoes TBS Portal), one working area per role; booking is a form + recent list, queues are list + detail, calendar is month grid over a room x hour day grid. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#f6f8fb; --ink:#1a2233; --muted:#576277; --line:#d8dde6;
  --nav:#243049; --nav-ink:#eef2f9; --nav-muted:#aab5ca; --nav-active:#ffffff; --nav-active-ink:#243049;
  --primary:#1f4f94; --primary-ink:#ffffff; --primary-soft:#e3ecf8;
  --ok:#17673f; --ok-bg:#ddf0e5; --warn:#855300; --warn-bg:#fdefcf; --bad:#a82820; --bad-bg:#fbe3e0; --info:#24598c; --info-bg:#e0ebf6;
  --focus:#d98a00; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --font:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111724; --surface:#192133; --surface2:#1f283b; --ink:#e7ecf6; --muted:#9ba7bd; --line:#2d384e;
  --nav:#0d1320; --nav-ink:#e7ecf6; --nav-muted:#93a0b8; --nav-active:#e7ecf6; --nav-active-ink:#0d1320;
  --primary:#7cabf0; --primary-ink:#0c1524; --primary-soft:#22324d;
  --ok:#74d3a0; --ok-bg:#16382a; --warn:#f1bb5b; --warn-bg:#3a2d10; --bad:#ff958c; --bad-bg:#3d1c1a; --info:#8dbbea; --info-bg:#1b2d44;
  --focus:#f0b44a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111724; --surface:#192133; --surface2:#1f283b; --ink:#e7ecf6; --muted:#9ba7bd; --line:#2d384e;
  --nav:#0d1320; --nav-ink:#e7ecf6; --nav-muted:#93a0b8; --nav-active:#e7ecf6; --nav-active-ink:#0d1320;
  --primary:#7cabf0; --primary-ink:#0c1524; --primary-soft:#22324d;
  --ok:#74d3a0; --ok-bg:#16382a; --warn:#f1bb5b; --warn-bg:#3a2d10; --bad:#ff958c; --bad-bg:#3d1c1a; --info:#8dbbea; --info-bg:#1b2d44;
  --focus:#f0b44a; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.55rem;font-weight:600}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:.01em}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem}

/* header */
.top{background:var(--nav);color:var(--nav-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{font-family:var(--mono);font-weight:500;font-size:.95rem;letter-spacing:.08em;border:1.5px solid var(--nav-muted);padding:3px 8px;border-radius:4px}
.brand b{font-weight:600;font-size:1.05rem}
.brand small{display:block;color:var(--nav-muted);font-size:.78rem;line-height:1.3}
.roles{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.roles .lbl{color:var(--nav-muted);font-size:.82rem;margin-right:2px}
.rbtn{background:transparent;border:1px solid #ffffff33;color:var(--nav-ink);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.88rem}
.rbtn:hover{border-color:#ffffff88}
.rbtn[aria-checked="true"]{background:var(--nav-active);color:var(--nav-active-ink);border-color:var(--nav-active);font-weight:600}
.rbtn.reset{border-style:dashed;color:var(--nav-muted)}

/* nav */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-end}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab.demo{margin-left:auto;font-size:.88rem}
.badge{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:999px;font-size:.75rem;line-height:1;padding:3px 7px;font-weight:600;font-variant-numeric:tabular-nums}

main{padding-block:22px 40px}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:16px}
.who{font-size:.86rem;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}

/* cards, forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.split.q{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
@media (max-width:860px){.split,.split.q{grid-template-columns:minmax(0,1fr)}}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}}
label,legend{font-weight:500;font-size:.92rem}
.req{color:var(--bad)}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px}
input[type=file]{width:100%;font-size:.9rem}
textarea{resize:vertical;min-height:76px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--primary);color:var(--primary-ink);border:1px solid var(--primary);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--primary);border-color:var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

.alert{border-radius:8px;padding:10px 14px;font-size:.92rem;border:1px solid}
.alert.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.alert ul{margin:4px 0 0;padding-left:20px}
.avail{display:flex;flex-direction:column;gap:6px}

/* pills & status */
.pill{display:inline-block;border-radius:999px;font-size:.78rem;font-weight:600;padding:2px 10px;border:1px solid;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);border-style:dashed}
.p-info{background:var(--info-bg);color:var(--info);border-color:var(--info);border-style:dashed}
.p-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.row:hover{border-color:var(--primary)}
.row[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.row .l{min-width:0;display:flex;flex-direction:column}
.row .l span{overflow-wrap:anywhere}
.row.static{cursor:default}.row.static:hover{border-color:var(--line)}
.empty{color:var(--muted);padding:24px 8px;text-align:center}

/* detail */
.det-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:0}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:420px){.kv{grid-template-columns:minmax(0,1fr);gap:0}.kv dt{margin-top:8px}}
fieldset{border:1px solid var(--line);border-radius:8px;margin:16px 0 0;padding:10px 14px 12px;min-width:0}
legend{padding:0 6px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-weight:400;cursor:pointer}
.chk input{margin-top:6px;width:16px;height:16px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:400;font-size:.9rem;background:var(--surface2)}
.chip:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.statusbar{margin-top:16px;padding:10px 14px;border-radius:8px;border:1px solid;font-weight:500}
.sb-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.sb-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);border-style:dashed}
.sb-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.log{list-style:none;margin:6px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.log li{font-size:.88rem;position:relative}
.log li::before{content:"";position:absolute;left:-20px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.log time{display:block;color:var(--muted);font-size:.8rem}
.sub{margin-top:18px;font-size:.92rem;font-weight:600}

/* calendar */
.calbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.calbar h2{margin-right:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin-bottom:12px}
.legend .pill{font-size:.74rem}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:.82rem;color:var(--muted);padding:4px 0}
.day{background:var(--surface2);border:1px solid var(--line);border-radius:6px;min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0;overflow:hidden}
.day.blank{background:transparent;border:0;cursor:default}
.day:not(.blank):hover{border-color:var(--primary)}
.day.today .n{background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:0 7px}
.day.sel{border:2px solid var(--primary);padding:4px}
.n{font-size:.84rem;font-weight:600;align-self:flex-start;font-variant-numeric:tabular-nums}
.ev{font-size:.74rem;line-height:1.35;border-radius:4px;padding:1px 5px;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ev.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ev.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);border-style:dashed}
.more{font-size:.72rem;color:var(--muted)}
.cnts{display:none;gap:3px;flex-wrap:wrap}
.cnt{font-size:.72rem;font-weight:600;border-radius:4px;padding:0 5px;border:1px solid;font-variant-numeric:tabular-nums}
.cnt.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.cnt.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);border-style:dashed}
@media (max-width:640px){.day{min-height:62px}.ev,.more{display:none}.cnts{display:flex}}
.gridscroll{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px}
.grid{min-width:780px}
.gr{display:grid;grid-template-columns:76px minmax(0,1fr);border-top:1px solid var(--line)}
.gr:first-child{border-top:0}
.gl{padding:10px 10px;font-weight:600;font-size:.9rem;background:var(--surface2);border-right:1px solid var(--line)}
.gt{position:relative;height:46px;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 7.142857%)}
.gh .gt{height:28px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr))}
.gh .gt span{font-size:.72rem;color:var(--muted);padding:5px 0 0 4px;font-variant-numeric:tabular-nums}
.gh .gl{background:var(--surface2);color:var(--muted);font-weight:400;font-size:.8rem}
.blk{position:absolute;top:4px;bottom:4px;border:1px solid;border-radius:5px;font-size:.74rem;line-height:1.25;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.blk.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.blk.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);border-style:dashed}
.blk[aria-pressed="true"]{outline:2px solid var(--primary);outline-offset:1px}

/* report */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:12px 0}
.filters .fld{min-width:160px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
th{background:var(--surface2);font-weight:600;color:var(--muted);font-size:.82rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}

/* flow */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px;counter-reset:s}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.step .no{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.step h3{font-size:1rem}
.step p{font-size:.9rem;color:var(--muted)}
.step .btn{align-self:flex-start;margin-top:auto}
.after{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.84rem;color:var(--muted)}
.sec{margin-top:22px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:600}.no2{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.ticks{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,26,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;margin:auto;padding:20px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.paper{border:1px solid var(--line);border-radius:6px;padding:22px;background:var(--surface2);position:relative;overflow:hidden}
.paper .wm{position:absolute;right:-30px;top:22px;transform:rotate(18deg);font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;color:var(--bad);border:1.5px solid var(--bad);padding:2px 30px;opacity:.75}
.paper h3{font-size:1.15rem;margin-bottom:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--nav);color:var(--nav-ink);border-radius:10px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:.92rem}
.toast.show{display:flex;flex-wrap:wrap}
.toast .btn{background:var(--nav-active);color:var(--nav-active-ink);border-color:var(--nav-active)}
.toast .x{background:none;border:0;color:var(--nav-muted);font-size:1.3rem;cursor:pointer;line-height:1;padding:0 4px}
.foot{margin-top:28px;color:var(--muted);font-size:.84rem}
@media (prefers-reduced-motion:no-preference){.row,.btn,.day{transition:border-color .15s,background-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark">TBS</span>
      <div><b>ระบบจองห้องประชุม</b><small>ต้นแบบสำหรับนำเสนอ · ข้อมูลทั้งหมดเป็นตัวอย่าง</small></div>
    </div>
    <div class="roles" id="roles" role="radiogroup" aria-label="สลับมุมมองผู้ใช้"></div>
  </div>
</header>
<nav class="tabs" aria-label="เมนู"><div class="wrap" id="tabs"></div></nav>
<main class="wrap"><div id="view"></div>
  <p class="foot">ต้นแบบนี้ยังไม่เชื่อมฐานข้อมูลหรือระบบล็อกอินจริง ปุ่มสลับมุมมองด้านบนใช้แทนการล็อกอินผ่าน TBS Portal เพื่อให้เห็นว่าแต่ละบทบาทเห็นอะไรต่างกัน</p>
</main>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MON_S=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return isoOf(d)};
const fmtDate=s=>{const d=parse(s);return `${d.getDate()} ${MONTHS[d.getMonth()]} พ.ศ. ${d.getFullYear()+543}`};
const fmtShort=s=>{const d=parse(s);return `${d.getDate()} ${MON_S[d.getMonth()]} ${d.getFullYear()+543}`};
const tm=t=>t.replace(':','.');
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtTime=(a,b)=>`${tm(a)}–${tm(b)} น.`;
const stampDay=(off,t)=>`${fmtShort(addDays(off))} ${tm(t)} น.`;
const nowStamp=()=>{const n=new Date();return `${fmtShort(isoOf(n))} ${pad(n.getHours())}.${pad(n.getMinutes())} น.`};
const refOf=n=>`TBS-R-${TODAY.getFullYear()+543}-${String(n).padStart(4,'0')}`;
const codeOf=ref=>{let h=7;for(const c of ref)h=(h*31+c.charCodeAt(0))>>>0;const s=h.toString(36).toUpperCase().padStart(8,'0').slice(0,8);return s.slice(0,4)+'-'+s.slice(4)};
const byDT=(a,b)=>(a.date+a.start).localeCompare(b.date+b.start);

const ROOMS=['123','151','418','422','423','500'];
const PURPOSES=['จัดกิจกรรม','จัดอบรม/สัมมนา','ใช้เรียน/สอน','ประชุม','สอบ','อื่น ๆ'];
const EQUIP=['โปรเจกเตอร์และจอ','ไมโครโฟน','ระบบเสียง','โต๊ะ/เก้าอี้เพิ่ม','ป้ายและแบนเนอร์'];
const PAGES={book:'จอง',review:'เอกสารรอตรวจสอบ',approve:'เอกสารรออนุมัติ',calendar:'ปฏิทิน',report:'รายงาน',flow:'ผังขั้นตอนและสิทธิ์'};
const ROLES={
  project:{label:'โครงการ',menu:['book','calendar','report']},
  admin:{label:'Admin',menu:['review','calendar','report']},
  teacher:{label:'อาจารย์ผู้อนุมัติ',menu:['approve','calendar','report']},
  student:{label:'นักศึกษา',menu:['calendar','report']},
  staff:{label:'พนักงาน',menu:['calendar','report']}
};
const ST={review:{t:'รอตรวจสอบ',c:'info'},approval:{t:'รออนุมัติ',c:'warn'},approved:{t:'อนุมัติแล้ว',c:'ok'},rejected:{t:'ไม่อนุมัติ',c:'bad'}};
const pill=r=>`<span class="pill p-${ST[r.status].c}">${ST[r.status].t}</span>`;
const calCls=r=>r.status==='approved'?'ok':'warn';

function mk(n,off,room,start,end,org,who,purpose,status,reason){
  const c=Math.min(off,0)-3;
  const r={id:n,ref:refOf(n),org,requester:who,date:addDays(off),start,end,room,purpose,file:`บันทึกข้อความ_${org}.pdf`,status,review:null,decision:null,log:[]};
  r.log.push({at:stampDay(c,'09:15'),who:`โครงการ ${org}`,text:'ส่งคำขอพร้อมแนบบันทึกข้อความ'});
  if(status==='review')return r;
  if(status==='rejected'){
    r.decision={by:'Admin ฝ่ายอาคาร',stage:'ตรวจสอบ',reason,at:stampDay(c+1,'10:05')};
    r.log.push({at:r.decision.at,who:'Admin ฝ่ายอาคาร',text:`ไม่ผ่านการตรวจสอบ: ${reason}`});
    return r;
  }
  r.review={free:true,suit:true,equip:['โปรเจกเตอร์และจอ','ไมโครโฟน'],note:'ห้องว่างและเหมาะสมกับกิจกรรม',by:'Admin ฝ่ายอาคาร',at:stampDay(c+1,'10:30')};
  r.log.push({at:r.review.at,who:'Admin ฝ่ายอาคาร',text:'ตรวจสอบห้องและอุปกรณ์แล้ว ส่งต่อให้อาจารย์ผู้รับผิดชอบ'});
  if(status==='approved'){
    r.decision={by:'อาจารย์ผู้รับผิดชอบ',reason:'',at:stampDay(c+2,'14:20')};
    r.log.push({at:r.decision.at,who:'อาจารย์ผู้รับผิดชอบ',text:'อนุมัติ'});
  }
  return r;
}
function seed(){
  return [
    [0,'418','10:00','15:00','IBMP','นางสาวพิมพ์ชนก (ตัวอย่าง)','จัดอบรม/สัมมนา','approved'],
    [0,'500','09:00','16:00','BBM','นายกิตติ (ตัวอย่าง)','จัดกิจกรรม','approved'],
    [1,'123','13:00','16:00','BBA','นางสาวอรุณี (ตัวอย่าง)','ใช้เรียน/สอน','approved'],
    [3,'422','09:00','12:00','BBA','นายธีรภัทร (ตัวอย่าง)','จัดกิจกรรม','approved'],
    [7,'418','13:00','17:00','IBMP','นางสาวพิมพ์ชนก (ตัวอย่าง)','ประชุม','approved'],
    [-3,'500','08:00','12:00','BBM','นายกิตติ (ตัวอย่าง)','สอบ','approved'],
    [2,'423','14:00','17:00','BBA','นางสาวอรุณี (ตัวอย่าง)','จัดกิจกรรม','review'],
    [5,'151','09:00','11:30','BBM','นายกิตติ (ตัวอย่าง)','ประชุม','review'],
    [4,'500','08:00','12:00','IBMP','นางสาวพิมพ์ชนก (ตัวอย่าง)','จัดอบรม/สัมมนา','approval'],
    [-5,'418','09:00','12:00','BBA','นายธีรภัทร (ตัวอย่าง)','จัดกิจกรรม','rejected','ห้อง 418 มีงานบำรุงรักษาระบบปรับอากาศในช่วงเวลานี้']
  ].map((d,i)=>mk(i+1,...d));
}
const fresh=()=>({role:'project',view:'book',reqs:seed(),seq:10,cal:{y:TODAY.getFullYear(),m:TODAY.getMonth(),sel:isoOf(TODAY),pick:null},sel:{review:null,approve:null},rep:{q:'',org:''},fileName:'',draft:{},modal:null,toastFn:null});
let S=fresh();

const overlaps=(a,b)=>a.date===b.date&&a.room.trim().toLowerCase()===b.room.trim().toLowerCase()&&mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end);
const conflicts=(x,sts)=>S.reqs.filter(r=>r.id!==x.id&&sts.includes(r.status)&&overlaps(r,x));
const draft=id=>S.draft[id]||(S.draft[id]={free:false,suit:false,equip:[],note:'',reason:''});
const count=st=>S.reqs.filter(r=>r.status===st).length;

/* ---------- chrome ---------- */
function renderChrome(){
  $('#roles').innerHTML='<span class="lbl">ดูในมุมมองของ</span>'+Object.entries(ROLES).map(([k,v])=>`<button class="rbtn" role="radio" aria-checked="${S.role===k}" data-act="role" data-v="${k}">${v.label}</button>`).join('')+'<button class="rbtn reset" data-act="reset" title="คืนข้อมูลตัวอย่างเป็นค่าเริ่มต้น">รีเซ็ตข้อมูล</button>';
  const tabs=ROLES[S.role].menu.map(k=>{
    const n=k==='review'?count('review'):k==='approve'?count('approval'):0;
    return `<button class="tab" data-act="nav" data-v="${k}" ${S.view===k?'aria-current="page"':''}>${PAGES[k]}${n?`<span class="badge">${n}</span>`:''}</button>`;
  }).join('');
  $('#tabs').innerHTML=tabs+`<button class="tab demo" data-act="nav" data-v="flow" ${S.view==='flow'?'aria-current="page"':''}>${PAGES.flow}</button>`;
}
function head(title,extra=''){
  const r=ROLES[S.role];
  return `<div class="pagehead"><h1>${title}</h1><p class="who">มุมมอง: <b>${r.label}</b> · เมนูที่เห็น ${r.menu.map(k=>PAGES[k]).join(', ')}${extra}</p></div>`;
}
function toast(msg,act){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>`+(act?`<button class="btn sm" data-act="toast">${esc(act.label)}</button>`:'')+'<button class="x" data-act="toast-x" aria-label="ปิด">×</button>';
  S.toastFn=act?act.fn:null;t.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),10000);
}

/* ---------- shared detail ---------- */
function kv(r){
  return `<dl class="kv"><dt>ห้อง</dt><dd>${esc(r.room)}</dd><dt>วันที่</dt><dd>${fmtDate(r.date)}</dd><dt>เวลา</dt><dd>${fmtTime(r.start,r.end)}</dd><dt>หน่วยงาน</dt><dd>${esc(r.org)}</dd><dt>ผู้จอง</dt><dd>${esc(r.requester)}</dd><dt>วัตถุประสงค์</dt><dd>${esc(r.purpose)}</dd><dt>เอกสารแนบ</dt><dd class="mono">${esc(r.file)}</dd></dl>`;
}
function logHTML(r){
  return `<h3 class="sub">ประวัติการดำเนินการ</h3><ol class="log">${r.log.map(l=>`<li><b>${esc(l.who)}</b> · ${esc(l.text)}<time>${esc(l.at)}</time></li>`).join('')}</ol>`;
}
function statusBar(r){
  if(r.status==='approved')return `<div class="statusbar sb-ok">สถานะ: อนุมัติแล้ว · โดย ${esc(r.decision.by)} เมื่อ ${esc(r.decision.at)}</div>`;
  if(r.status==='rejected')return `<div class="statusbar sb-bad">สถานะ: ไม่อนุมัติ · ${esc(r.decision.reason)}</div>`;
  return `<div class="statusbar sb-warn">สถานะ: กำลังดำเนินการ · ${r.status==='review'?'รอ Admin ตรวจสอบห้องและอุปกรณ์':'รออาจารย์ผู้รับผิดชอบพิจารณา'}</div>`;
}
function sysCheck(r){
  const c=conflicts(r,['approved']);
  return c.length
    ?`<div class="alert bad" style="margin-top:14px">ระบบตรวจสอบซ้ำ: ห้องนี้ช่วงเวลานี้ทับกับรายการที่อนุมัติแล้ว ${c.map(x=>`${esc(x.org)} ${fmtTime(x.start,x.end)}`).join(', ')}</div>`
    :`<div class="alert ok" style="margin-top:14px">ระบบตรวจสอบซ้ำ: ไม่พบรายการอนุมัติที่ทับซ้อนกับห้องและเวลานี้</div>`;
}

/* ---------- booking ---------- */
function vBook(){
  S.fileName='';
  const recent=[...S.reqs].sort((a,b)=>b.id-a.id).slice(0,6);
  return head('จองห้องประชุม')+`<div class="split">
  <section class="card">
    <div class="card-h"><h2>แบบขอใช้ห้องประชุม</h2><button class="btn ghost sm" type="button" data-act="fill">เติมข้อมูลตัวอย่าง</button></div>
    <p class="hint">โครงการรับบันทึกข้อความจากนักศึกษา แล้วกรอกข้อมูลและแนบไฟล์ที่นี่ ก่อนส่งให้ฝ่ายอาคารตรวจสอบ</p>
    <div id="formErr" class="alert bad" role="alert" hidden style="margin-top:12px"></div>
    <form id="bookForm" novalidate>
      <div class="fields">
        <div class="fld"><label for="f-org">หน่วยงาน (โครงการ) <span class="req">*</span></label><input id="f-org" type="text" placeholder="เช่น BBA, IBMP, BBM" autocomplete="off"></div>
        <div class="fld"><label for="f-req">ชื่อผู้จอง <span class="req">*</span></label><input id="f-req" type="text" placeholder="ชื่อนักศึกษาผู้ยื่นขอ" autocomplete="off"></div>
        <div class="fld"><label for="f-date">วันที่ใช้ห้อง <span class="req">*</span></label><input id="f-date" type="date" min="${isoOf(TODAY)}"></div>
        <div class="fld"><label for="f-room">ห้องที่จะใช้ <span class="req">*</span></label><input id="f-room" type="text" list="roomlist" placeholder="พิมพ์เลขห้อง เช่น 418" autocomplete="off"><datalist id="roomlist">${ROOMS.map(r=>`<option value="${r}">`).join('')}</datalist></div>
        <div class="fld"><label for="f-start">เวลาเริ่ม <span class="req">*</span></label><input id="f-start" type="time" step="900"></div>
        <div class="fld"><label for="f-end">เวลาสิ้นสุด <span class="req">*</span></label><input id="f-end" type="time" step="900"></div>
        <div class="fld wide"><div id="avail" class="avail" aria-live="polite" hidden></div></div>
        <div class="fld wide"><label for="f-purpose">วัตถุประสงค์ <span class="req">*</span></label><select id="f-purpose"><option value="">เลือกวัตถุประสงค์</option>${PURPOSES.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="fld wide"><label for="f-file">แนบบันทึกข้อความของนักศึกษา <span class="req">*</span></label><input id="f-file" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
          <p class="hint"><span id="fileName">ยังไม่ได้เลือกไฟล์</span> · <button class="btn ghost sm" type="button" data-act="file-demo">ใช้ไฟล์ตัวอย่างสำหรับสาธิต</button></p></div>
      </div>
      <div class="actions"><button class="btn" type="submit">ส่งให้ฝ่ายอาคารตรวจสอบ</button></div>
    </form>
  </section>
  <section class="card">
    <h2>คำขอที่ส่งล่าสุด</h2>
    <p class="hint">สถานะอัปเดตทันทีเมื่อ Admin และอาจารย์ดำเนินการ</p>
    <div class="list">${recent.map(r=>`<div class="row static"><div class="l"><b class="mono">${r.ref}</b><span>${esc(r.org)} · ห้อง ${esc(r.room)}</span><span class="muted">${fmtShort(r.date)} ${fmtTime(r.start,r.end)}</span></div>${pill(r)}</div>`).join('')}</div>
  </section></div>`;
}
function checkAvail(){
  const box=$('#avail');if(!box)return;
  const x={id:0,date:$('#f-date').value,room:$('#f-room').value,start:$('#f-start').value,end:$('#f-end').value};
  if(!x.date||!x.room.trim()||!x.start||!x.end){box.hidden=true;return}
  const line=(c,t)=>`<div class="alert ${c}">${t}</div>`;
  const li=l=>l.map(r=>`${esc(r.org)} ${fmtTime(r.start,r.end)}`).join(', ');
  let h='';
  if(mins(x.end)<=mins(x.start))h=line('bad','เวลาสิ้นสุดต้องหลังเวลาเริ่ม');
  else{
    const ap=conflicts(x,['approved']),pe=conflicts(x,['review','approval']);
    if(ap.length)h+=line('bad',`ช่วงเวลานี้มีผู้ใช้ห้องแล้ว (อนุมัติแล้ว): ${li(ap)} กรุณาเลือกเวลาหรือห้องอื่น`);
    if(pe.length)h+=line('warn',`มีคำขออื่นกำลังดำเนินการในช่วงเวลานี้: ${li(pe)} ส่งได้ แต่ต้องรอผลก่อน`);
    if(!ap.length&&!pe.length)h+=line('ok','ช่วงเวลานี้ยังว่างตามปฏิทิน');
    if(!ROOMS.includes(x.room.trim()))h+=line('info','ไม่พบเลขห้องนี้ในรายการห้อง Admin จะตรวจสอบอีกครั้ง');
  }
  box.innerHTML=h;box.hidden=false;
}
function submitBook(){
  const v={org:$('#f-org').value.trim(),req:$('#f-req').value.trim(),date:$('#f-date').value,room:$('#f-room').value.trim(),start:$('#f-start').value,end:$('#f-end').value,purpose:$('#f-purpose').value};
  const errs=[];
  if(!v.org)errs.push(['f-org','กรอกชื่อหน่วยงานหรือโครงการ']);
  if(!v.req)errs.push(['f-req','กรอกชื่อผู้จอง']);
  if(!v.date)errs.push(['f-date','เลือกวันที่ใช้ห้อง']);else if(v.date<isoOf(TODAY))errs.push(['f-date','จองย้อนหลังไม่ได้']);
  if(!v.room)errs.push(['f-room','ระบุห้องที่จะใช้']);
  if(!v.start||!v.end)errs.push(['f-start','ระบุเวลาเริ่มและเวลาสิ้นสุด']);else if(mins(v.end)<=mins(v.start))errs.push(['f-end','เวลาสิ้นสุดต้องหลังเวลาเริ่ม']);
  if(!v.purpose)errs.push(['f-purpose','เลือกวัตถุประสงค์']);
  if(!S.fileName)errs.push(['f-file','แนบบันทึกข้อความของนักศึกษา']);
  if(!errs.length){
    const c=conflicts({id:0,date:v.date,room:v.room,start:v.start,end:v.end},['approved']);
    if(c.length)errs.push(['f-room','ห้องและเวลานี้มีรายการอนุมัติแล้ว ('+c.map(x=>x.org+' '+fmtTime(x.start,x.end)).join(', ')+')']);
  }
  ['f-org','f-req','f-date','f-room','f-start','f-end','f-purpose','f-file'].forEach(id=>{const e=$('#'+id);if(e)e.removeAttribute('aria-invalid')});
  const box=$('#formErr');
  if(errs.length){
    errs.forEach(([id])=>$('#'+id).setAttribute('aria-invalid','true'));
    box.innerHTML=`ยังส่งไม่ได้ กรุณาแก้ ${errs.length} รายการ<ul>${errs.map(e=>`<li>${esc(e[1])}</li>`).join('')}</ul>`;box.hidden=false;
    $('#'+errs[0][0]).focus();return;
  }
  box.hidden=true;
  const id=++S.seq;
  const r={id,ref:refOf(id),org:v.org,requester:v.req,date:v.date,start:v.start,end:v.end,room:v.room,purpose:v.purpose,file:S.fileName,status:'review',review:null,decision:null,log:[{at:nowStamp(),who:`โครงการ ${v.org}`,text:'ส่งคำขอพร้อมแนบบันทึกข้อความ'}]};
  S.reqs.push(r);S.sel.review=id;
  render();
  toast(`ส่งคำขอ ${r.ref} แล้ว สถานะ: รอตรวจสอบ`,{label:'ดูต่อในมุมมอง Admin',fn:()=>{S.role='admin';S.view='review';S.sel.review=id;render()}});
}

/* ---------- review / approve queues ---------- */
function vQueue(kind){
  const st=kind==='review'?'review':'approval';
  const list=S.reqs.filter(r=>r.status===st).sort(byDT);
  if(!list.find(r=>r.id===S.sel[kind]))S.sel[kind]=list[0]?list[0].id:null;
  const sel=list.find(r=>r.id===S.sel[kind]);
  const title=kind==='review'?'เอกสารคำร้องขอใช้ห้องรอตรวจสอบ':'เอกสารคำร้องขอรออนุมัติ';
  const left=list.length?`<div class="list">${list.map(r=>`<button class="row" data-act="sel" data-kind="${kind}" data-id="${r.id}" aria-pressed="${r.id===S.sel[kind]}"><div class="l"><b class="mono">${r.ref}</b><span>${esc(r.org)} · ห้อง ${esc(r.room)}</span><span class="muted">${fmtShort(r.date)} ${fmtTime(r.start,r.end)}</span></div>${pill(r)}</button>`).join('')}</div>`:`<p class="empty">${kind==='review'?'ไม่มีเอกสารรอตรวจสอบ':'ไม่มีเอกสารรออนุมัติ'}</p>`;
  return head(title)+`<div class="split q"><section class="card"><h2>รายการ (${list.length})</h2>${left}</section><section class="card" id="detail">${sel?detailQueue(sel,kind):'<p class="empty">เลือกเอกสารจากรายการเพื่อดูรายละเอียด</p>'}</section></div>`;
}
function detailQueue(r,kind){
  const d=draft(r.id);
  const top=`<div class="det-h"><h2><span class="mono">${r.ref}</span></h2>${pill(r)}</div>${kv(r)}${sysCheck(r)}`;
  if(kind==='review'){
    return top+`<fieldset><legend>ผลการตรวจสอบห้อง</legend>
      <label class="chk"><input type="checkbox" data-draft="free" ${d.free?'checked':''}> ห้องว่างในระบบและพร้อมใช้งาน</label>
      <label class="chk"><input type="checkbox" data-draft="suit" ${d.suit?'checked':''}> ห้องเหมาะสมกับกิจกรรมและจำนวนผู้เข้าร่วม</label></fieldset>
      <fieldset><legend>อุปกรณ์ที่ต้องเตรียม</legend><div class="chips">${EQUIP.map(e=>`<label class="chip"><input type="checkbox" data-equip="${esc(e)}" ${d.equip.includes(e)?'checked':''}> ${e}</label>`).join('')}</div></fieldset>
      <div class="fld" style="margin-top:16px"><label for="d-note">หมายเหตุถึงอาจารย์ (หรือเหตุผลหากไม่ผ่าน)</label><textarea id="d-note" data-draft="note">${esc(d.note)}</textarea></div>
      <div id="qerr" class="alert bad" role="alert" hidden style="margin-top:12px"></div>
      <div class="actions"><button class="btn" data-act="fwd" data-id="${r.id}" ${d.free&&d.suit?'':'disabled'}>ส่งต่อให้อาจารย์ผู้รับผิดชอบ</button><button class="btn danger" data-act="rej-review" data-id="${r.id}">ไม่ผ่านการตรวจสอบ</button></div>
      <p class="hint" style="margin-top:8px">ปุ่มส่งต่อจะกดได้เมื่อติ๊กว่าห้องว่างและเหมาะสมทั้งสองข้อ</p>`+logHTML(r);
  }
  const rv=r.review;
  return top+`<h3 class="sub">ผลตรวจสอบจาก Admin</h3><dl class="kv" style="margin-top:6px"><dt>ห้องว่าง</dt><dd>${rv.free?'ว่างและพร้อมใช้งาน':'-'}</dd><dt>ความเหมาะสม</dt><dd>${rv.suit?'เหมาะสมกับกิจกรรม':'-'}</dd><dt>อุปกรณ์</dt><dd>${rv.equip.length?esc(rv.equip.join(', ')):'ไม่ต้องใช้อุปกรณ์เพิ่ม'}</dd><dt>หมายเหตุ</dt><dd>${esc(rv.note||'-')}</dd><dt>ตรวจโดย</dt><dd>${esc(rv.by)} · ${esc(rv.at)}</dd></dl>
    <div class="fld" style="margin-top:16px"><label for="d-reason">เหตุผล (จำเป็นเมื่อไม่อนุมัติ)</label><textarea id="d-reason" data-draft="reason">${esc(d.reason)}</textarea></div>
    <div id="qerr" class="alert bad" role="alert" hidden style="margin-top:12px"></div>
    <div class="actions"><button class="btn" data-act="approve" data-id="${r.id}">อนุมัติ</button><button class="btn danger" data-act="reject" data-id="${r.id}">ไม่อนุมัติ</button></div>`+logHTML(r);
}
function setErr(m){const e=$('#qerr');if(e){e.textContent=m;e.hidden=false}}
function actFwd(id){
  const r=S.reqs.find(x=>x.id===id),d=draft(id);if(!r||!(d.free&&d.suit))return;
  r.review={free:d.free,suit:d.suit,equip:[...d.equip],note:d.note.trim(),by:'Admin ฝ่ายอาคาร',at:nowStamp()};
  r.status='approval';
  r.log.push({at:r.review.at,who:'Admin ฝ่ายอาคาร',text:'ตรวจสอบห้องและอุปกรณ์แล้ว ส่งต่อให้อาจารย์ผู้รับผิดชอบ'});
  S.sel.approve=id;render();
  toast(`ส่งต่อ ${r.ref} ให้อาจารย์แล้ว ปฏิทินแสดงเป็น "กำลังดำเนินการ"`,{label:'ดูในมุมมองอาจารย์',fn:()=>{S.role='teacher';S.view='approve';S.sel.approve=id;render()}});
}
function actRejReview(id){
  const r=S.reqs.find(x=>x.id===id),d=draft(id);
  if(!d.note.trim())return setErr('กรอกเหตุผลที่ไม่ผ่านการตรวจสอบในช่องหมายเหตุ');
  r.status='rejected';r.decision={by:'Admin ฝ่ายอาคาร',stage:'ตรวจสอบ',reason:d.note.trim(),at:nowStamp()};
  r.log.push({at:r.decision.at,who:'Admin ฝ่ายอาคาร',text:`ไม่ผ่านการตรวจสอบ: ${r.decision.reason}`});
  render();toast(`บันทึก ${r.ref} เป็น ไม่อนุมัติ พร้อมเหตุผลแล้ว`);
}
function actApprove(id){
  const r=S.reqs.find(x=>x.id===id);
  const c=conflicts(r,['approved']);
  if(c.length)return setErr('อนุมัติไม่ได้ เพราะห้องและเวลานี้ทับกับรายการที่อนุมัติแล้ว');
  r.status='approved';r.decision={by:'อาจารย์ผู้รับผิดชอบ',reason:'',at:nowStamp()};
  r.log.push({at:r.decision.at,who:'อาจารย์ผู้รับผิดชอบ',text:'อนุมัติ'});
  S.cal.y=parse(r.date).getFullYear();S.cal.m=parse(r.date).getMonth();S.cal.sel=r.date;S.cal.pick=r.id;
  render();
  toast(`อนุมัติ ${r.ref} แล้ว รายการขึ้นปฏิทินเป็น "อนุมัติแล้ว" และมีในรายงาน`,{label:'ดูในปฏิทิน',fn:()=>{S.view='calendar';render()}});
}
function actReject(id){
  const r=S.reqs.find(x=>x.id===id),d=draft(id);
  if(!d.reason.trim())return setErr('กรอกเหตุผลที่ไม่อนุมัติ');
  r.status='rejected';r.decision={by:'อาจารย์ผู้รับผิดชอบ',stage:'อนุมัติ',reason:d.reason.trim(),at:nowStamp()};
  r.log.push({at:r.decision.at,who:'อาจารย์ผู้รับผิดชอบ',text:`ไม่อนุมัติ: ${r.decision.reason}`});
  render();toast(`บันทึก ${r.ref} เป็น ไม่อนุมัติ พร้อมเหตุผลแล้ว`);
}

/* ---------- calendar ---------- */
function vCalendar(){
  const {y,m}=S.cal;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const live=S.reqs.filter(r=>r.status!=='rejected');
  const by={};live.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`,list=(by[key]||[]).sort(byDT);
    const ok=list.filter(r=>r.status==='approved').length,pe=list.length-ok;
    cells+=`<button class="day${key===isoOf(TODAY)?' today':''}${key===S.cal.sel?' sel':''}" data-act="cal-day" data-d="${key}" aria-label="${fmtDate(key)} มี ${list.length} รายการ"><span class="n">${d}</span>${list.slice(0,2).map(r=>`<span class="ev ${calCls(r)}">${esc(r.room)} · ${tm(r.start)}</span>`).join('')}${list.length>2?`<span class="more">อีก ${list.length-2} รายการ</span>`:''}<span class="cnts">${ok?`<span class="cnt ok">${ok}</span>`:''}${pe?`<span class="cnt warn">${pe}</span>`:''}</span></button>`;
  }
  return head('ปฏิทินการจอง')+`<section class="card">
    <div class="calbar"><h2>${MONTHS[m]} พ.ศ. ${y+543}</h2><button class="btn ghost sm" data-act="cal-prev" aria-label="เดือนก่อนหน้า">ก่อนหน้า</button><button class="btn ghost sm" data-act="cal-today">วันนี้</button><button class="btn ghost sm" data-act="cal-next" aria-label="เดือนถัดไป">ถัดไป</button></div>
    <div class="legend"><span><span class="pill p-ok">อนุมัติแล้ว</span> เส้นทึบ</span><span><span class="pill p-warn">กำลังดำเนินการ</span> เส้นประ (รอตรวจสอบหรือรออนุมัติ)</span><span>รายการที่ไม่อนุมัติไม่แสดงในปฏิทิน</span></div>
    <div class="month">${cells}</div></section>
    <section class="card" style="margin-top:20px">${dayPanel()}</section>`;
}
function dayPanel(){
  const date=S.cal.sel,items=S.reqs.filter(r=>r.date===date&&r.status!=='rejected').sort(byDT);
  const pick=items.find(r=>r.id===S.cal.pick)||items[0]||null;
  const rooms=[...new Set([...ROOMS,...items.map(r=>r.room)])];
  const H0=8,N=14;
  const hours=Array.from({length:N},(_,i)=>`<span>${H0+i}.00</span>`).join('');
  const rows=rooms.map(room=>{
    const bl=items.filter(r=>r.room.trim().toLowerCase()===room.toLowerCase()).map(r=>{
      const s=Math.max(mins(r.start),H0*60),e=Math.min(mins(r.end),(H0+N)*60);
      return `<button class="blk ${calCls(r)}" style="left:${(s-H0*60)/(N*60)*100}%;width:${Math.max(e-s,15)/(N*60)*100}%" data-act="pick" data-id="${r.id}" aria-pressed="${pick&&pick.id===r.id}" title="${esc(r.org)} ${fmtTime(r.start,r.end)}">${tm(r.start)}–${tm(r.end)} ${esc(r.org)}</button>`;
    }).join('');
    return `<div class="gr"><div class="gl">ห้อง ${esc(room)}</div><div class="gt">${bl}</div></div>`;
  }).join('');
  const list=items.length?`<div class="list">${items.map(r=>`<button class="row" data-act="pick" data-id="${r.id}" aria-pressed="${pick&&pick.id===r.id}"><div class="l"><b>ห้อง ${esc(r.room)} · ${fmtTime(r.start,r.end)}</b><span class="muted">${esc(r.org)} · ${esc(r.purpose)}</span></div><span class="pill p-${calCls(r)}">${r.status==='approved'?'อนุมัติแล้ว':'กำลังดำเนินการ'}</span></button>`).join('')}</div>`:'<p class="empty">วันนี้ยังไม่มีรายการจอง</p>';
  return `<h2>${fmtDate(date)}</h2><p class="hint">ตารางห้อง × เวลา (8.00–22.00 น.) กดที่แถบหรือรายการเพื่อดูรายละเอียด</p>
    <div class="gridscroll"><div class="grid"><div class="gr gh"><div class="gl">เวลา</div><div class="gt">${hours}</div></div>${rows}</div></div>
    <div class="split" style="margin-top:16px"><div><h3>รายการของวัน</h3>${list}</div><div>${pick?`<h3>รายละเอียด</h3><div style="margin-top:10px"><div class="det-h"><span class="mono">${pick.ref}</span>${pill(pick)}</div>${kv(pick)}${statusBar(pick)}${logHTML(pick)}</div>`:'<h3>รายละเอียด</h3><p class="empty">เลือกรายการเพื่อดูรายละเอียด</p>'}</div></div>`;
}

/* ---------- report ---------- */
function repRows(){
  const q=S.rep.q.trim().toLowerCase();
  const rows=S.reqs.filter(r=>r.status==='approved'&&(!S.rep.org||r.org===S.rep.org)&&(!q||[r.ref,r.room,r.org,r.requester,r.purpose].join(' ').toLowerCase().includes(q))).sort((a,b)=>byDT(b,a));
  return {n:rows.length,html:rows.length?rows.map(r=>`<tr><td class="mono nw">${r.ref}</td><td class="nw">${fmtShort(r.date)}</td><td class="nw">${fmtTime(r.start,r.end)}</td><td>${esc(r.room)}</td><td>${esc(r.org)}</td><td>${esc(r.requester)}</td><td>${esc(r.purpose)}</td><td class="nw"><button class="btn ghost sm" data-act="doc" data-id="${r.id}">ดูเอกสารอนุมัติ</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">ไม่พบรายการที่ตรงกับเงื่อนไข</td></tr>'};
}
function vReport(){
  const orgs=[...new Set(S.reqs.filter(r=>r.status==='approved').map(r=>r.org))].sort();
  const t=repRows();
  return head('รายงานการจอง')+`<section class="card"><h2>รายการที่อนุมัติแล้ว</h2><p class="hint">ทุกบทบาทเห็นรายงานเดียวกัน ใช้เปิดและดาวน์โหลดเอกสารอนุมัติ</p>
    <div class="filters"><div class="fld"><label for="r-q">ค้นหา</label><input id="r-q" type="text" value="${esc(S.rep.q)}" placeholder="เลขที่ ห้อง ผู้จอง"></div>
    <div class="fld"><label for="r-org">หน่วยงาน</label><select id="r-org"><option value="">ทั้งหมด</option>${orgs.map(o=>`<option ${S.rep.org===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
    <p class="hint" id="r-n" aria-live="polite">พบ ${t.n} รายการ</p></div>
    <div class="tblwrap"><table><thead><tr><th>เลขที่อ้างอิง</th><th>วันที่</th><th>เวลา</th><th>ห้อง</th><th>หน่วยงาน</th><th>ผู้จอง</th><th>วัตถุประสงค์</th><th>เอกสาร</th></tr></thead><tbody id="repBody">${t.html}</tbody></table></div></section>`;
}
function renderModal(){
  const m=$('#modal'),r=S.reqs.find(x=>x.id===S.modal);
  if(!r){m.hidden=true;m.innerHTML='';return}
  m.hidden=false;
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet-h"><h2 id="mt">เอกสารอนุมัติการใช้ห้อง</h2><button class="btn ghost sm" data-act="close" id="mclose">ปิด</button></div>
  <div class="paper"><span class="wm">ตัวอย่าง</span><h3>ใบอนุมัติการใช้ห้องประชุม</h3><p class="mono muted">เลขที่ ${r.ref}</p><div style="margin:14px 0">${kv(r)}</div>
  <p>อนุมัติโดย <b>${esc(r.decision.by)}</b> เมื่อ ${esc(r.decision.at)}</p><p style="margin-top:6px">ตรวจสอบห้องและอุปกรณ์โดย ${esc(r.review.by)} · อุปกรณ์: ${r.review.equip.length?esc(r.review.equip.join(', ')):'ไม่ต้องใช้อุปกรณ์เพิ่ม'}</p>
  <p style="margin-top:12px" class="muted">รหัสตรวจสอบเอกสาร <span class="mono">${codeOf(r.ref)}</span></p></div>
  <p class="hint" style="margin-top:12px">นี่คือตัวอย่างหน้าตาเอกสาร ในระบบจริงจะดาวน์โหลดเป็นไฟล์ PDF ที่มีเลขที่อ้างอิงและรหัสตรวจสอบเดียวกัน ใช้ตรวจสอบย้อนหลังได้ว่าเอกสารผ่านครบทุกขั้นตอน หน้าตัวอย่างนี้ดาวน์โหลดไม่ได้</p></div>`;
  $('#mclose').focus();

/* ---------- flow ---------- */

  const pg=['book','review','approve','calendar','report'];
  const steps=[
    ['โครงการ','กรอกแบบขอใช้ห้อง','รับบันทึกข้อความจากนักศึกษา กรอกหน่วยงาน ผู้จอง วันเวลา ห้อง วัตถุประสงค์ และแนบไฟล์','รอตรวจสอบ','info','project','book','เปิดหน้าจอง'],
    ['Admin','ตรวจสอบห้องและอุปกรณ์','ติ๊กว่าห้องว่างและเหมาะสม เลือกอุปกรณ์ที่ต้องเตรียม แล้วส่งต่อให้อาจารย์','รออนุมัติ','warn','admin','review','เปิดหน้าตรวจสอบ'],
    ['อาจารย์ผู้รับผิดชอบ','อนุมัติหรือไม่อนุมัติ','ดูผลตรวจสอบจาก Admin ตัดสินใจ ถ้าไม่อนุมัติต้องกรอกเหตุผล','อนุมัติแล้ว','ok','teacher','approve','เปิดหน้าอนุมัติ'],
    ['ทุกคน','เห็นผลในปฏิทินและรายงาน','รายการขึ้นปฏิทินทันที ดูรายละเอียดได้ และเปิดเอกสารอนุมัติจากรายงาน','อนุมัติแล้ว','ok','student','calendar','เปิดปฏิทิน']

  <section class="card sec"><h2>แต่ละบทบาทเห็นหน้าไหนบ้าง</h2><p class="hint">ระบบตรวจสิทธิ์ที่ฝั่งเซิร์ฟเวอร์ทุกครั้ง ไม่ใช่แค่ซ่อนเมนู</p>

}

/* ---------- render & events ---------- */
function render(){
  if(S.view!=='flow'&&!ROLES[S.role].menu.includes(S.view))S.view=ROLES[S.role].menu[0];
  renderChrome();
  const v={book:vBook,review:()=>vQueue('review'),approve:()=>vQueue('approve'),calendar:vCalendar,report:vReport,flow:vFlow}[S.view];
  $('#view').innerHTML=v();
  renderModal();
}
const A={
  role:a=>{S.role=a.dataset.v;render()},
  nav:a=>{S.view=a.dataset.v;render()},
  go:a=>{S.role=a.dataset.role;S.view=a.dataset.view;render();window.scrollTo(0,0)},
  reset:()=>{S=fresh();render();toast('คืนข้อมูลตัวอย่างเป็นค่าเริ่มต้นแล้ว')},
  fill:()=>{
    const set=(id,v)=>{$('#'+id).value=v};
    set('f-org','BBA');set('f-req','นายธนกร (ตัวอย่าง)');set('f-date',addDays(6));set('f-room','422');set('f-start','13:00');set('f-end','16:00');set('f-purpose','จัดกิจกรรม');
    S.fileName='บันทึกข้อความ_ขอใช้ห้อง.pdf';$('#fileName').textContent=S.fileName;checkAvail();
  },
  'file-demo':()=>{S.fileName='บันทึกข้อความ_ขอใช้ห้อง.pdf';$('#fileName').textContent=S.fileName+' (ไฟล์ตัวอย่าง)'},
  'cal-prev':()=>{S.cal.m--;if(S.cal.m<0){S.cal.m=11;S.cal.y--}render()},
  'cal-next':()=>{S.cal.m++;if(S.cal.m>11){S.cal.m=0;S.cal.y++}render()},
  'cal-today':()=>{S.cal.y=TODAY.getFullYear();S.cal.m=TODAY.getMonth();S.cal.sel=isoOf(TODAY);S.cal.pick=null;render()},
  'cal-day':a=>{S.cal.sel=a.dataset.d;S.cal.pick=null;render()},
  pick:a=>{S.cal.pick=+a.dataset.id;render()},
  sel:a=>{S.sel[a.dataset.kind]=+a.dataset.id;render()},
  fwd:a=>actFwd(+a.dataset.id),
  'rej-review':a=>actRejReview(+a.dataset.id),
  approve:a=>actApprove(+a.dataset.id),
  reject:a=>actReject(+a.dataset.id),
  doc:a=>{S.modal=+a.dataset.id;renderModal()},
  close:()=>{S.modal=null;renderModal()},
  toast:()=>{const f=S.toastFn;$('#toast').classList.remove('show');if(f)f()},
  'toast-x':()=>$('#toast').classList.remove('show')
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){A.close();return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)A.close()});
document.addEventListener('submit',e=>{if(e.target.id==='bookForm'){e.preventDefault();submitBook()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest('#bookForm')&&t.type!=='file')checkAvail();
  if(t.dataset&&t.dataset.draft&&t.tagName==='TEXTAREA'){const id=S.sel[S.view==='review'?'review':'approve'];draft(id)[t.dataset.draft]=t.value}
  if(t.id==='r-q'){S.rep.q=t.value;const x=repRows();$('#repBody').innerHTML=x.html;$('#r-n').textContent=`พบ ${x.n} รายการ`}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.closest('#bookForm'))checkAvail();
  if(t.id==='f-file'){S.fileName=t.files[0]?t.files[0].name:'';$('#fileName').textContent=S.fileName||'ยังไม่ได้เลือกไฟล์'}
  if(t.id==='r-org'){S.rep.org=t.value;const x=repRows();$('#repBody').innerHTML=x.html;$('#r-n').textContent=`พบ ${x.n} รายการ`}
  if(S.view==='review'&&t.dataset){
    const d=draft(S.sel.review);
    if(t.dataset.draft==='free'||t.dataset.draft==='suit')d[t.dataset.draft]=t.checked;
    if(t.dataset.equip){const i=d.equip.indexOf(t.dataset.equip);if(t.checked&&i<0)d.equip.push(t.dataset.equip);if(!t.checked&&i>=0)d.equip.splice(i,1)}
    const b=$('[data-act="fwd"]');if(b)b.disabled=!(d.free&&d.suit);
  }
});
render();
})();
</script>

</body></html>
